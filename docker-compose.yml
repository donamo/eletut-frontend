services:
  nginx:
    image: nginx:stable-alpine
    container_name: eletut_frontend_nginx
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=2 http://localhost:80/login.html | grep -q '<html' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - VIRTUAL_HOST=eletut.donamo.science
      - LETSENCRYPT_HOST=eletut.donamo.science
      - VIRTUAL_PORT=80

networks:
  default:
    name: nginx-proxy
    external: true
